# Production SPA server (Traefik routes /api to the backend; this serves the SPA).
server {
  listen 2001;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: serve index.html for unknown paths so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets cache forever; index.html + sitemap/robots stay fresh.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
